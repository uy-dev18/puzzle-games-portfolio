<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1024px; height:500px; overflow:hidden; }
  .stage {
    width:1024px; height:500px; position:relative;
    background: radial-gradient(120% 140% at 15% 10%, #6d5efc 0%, #4f46e5 38%, #3b1e91 75%, #2a1063 100%);
    font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow:hidden;
  }
  .blob { position:absolute; border-radius:50%; filter:blur(2px); opacity:.35; }
  .b1 { width:260px; height:260px; left:-70px; top:-80px; background:#a78bfa; opacity:.30; filter:blur(30px);}
  .b2 { width:220px; height:220px; right:280px; bottom:-90px; background:#ec4899; opacity:.28; filter:blur(35px);}
  .dots { position:absolute; inset:0; opacity:.10;
    background-image:radial-gradient(#fff 1.5px, transparent 1.6px);
    background-size:26px 26px; }

  .left { position:absolute; left:56px; top:0; height:500px; width:560px;
    display:flex; flex-direction:column; justify-content:center; }
  .badge { display:inline-flex; align-items:center; gap:8px; align-self:flex-start;
    background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.25);
    color:#fff; padding:7px 15px; border-radius:999px; font-size:15px; font-weight:600;
    backdrop-filter:blur(4px); margin-bottom:20px; }
  .badge b { font-size:16px; }
  h1 { color:#fff; font-size:66px; line-height:1.02; font-weight:800; letter-spacing:-1px;
    text-shadow:0 4px 24px rgba(0,0,0,.25); }
  h1 span { display:block; background:linear-gradient(90deg,#ffe27a,#ff9ec7);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .tag { color:rgba(255,255,255,.92); font-size:23px; font-weight:500; margin-top:18px; line-height:1.35; max-width:470px; }
  .pills { display:flex; gap:12px; margin-top:26px; }
  .pill { background:rgba(255,255,255,.92); color:#4130a8; font-weight:700; font-size:15px;
    padding:9px 16px; border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,.18); }

  .right { position:absolute; right:70px; top:50%; transform:translateY(-50%);
    width:330px; height:330px; }
  .frame { position:absolute; inset:-16px; border-radius:34px;
    background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.25);
    box-shadow:0 30px 70px rgba(0,0,0,.45); backdrop-filter:blur(2px); }
  .puzzle { position:absolute; inset:0; display:grid;
    grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:9px; }
  .tile { border-radius:12px; background-image:var(--img); background-size:300% 300%;
    box-shadow:0 6px 16px rgba(0,0,0,.35); }
  /* vị trí gốc của từng ô trong ảnh 3x3 */
  .p00{background-position:0% 0%}   .p01{background-position:50% 0%}   .p02{background-position:100% 0%}
  .p10{background-position:0% 50%}  .p11{background-position:50% 50%}  .p12{background-position:100% 50%}
  .p20{background-position:0% 100%} .p21{background-position:50% 100%} .p22{background-position:100% 100%}
  /* hai ô bị "xáo trộn" để thể hiện lối chơi đổi ô */
  .swapA{ transform:rotate(-5deg) scale(1.04); z-index:3; box-shadow:0 12px 26px rgba(0,0,0,.5); outline:3px solid #ffe27a; outline-offset:-3px;}
  .swapB{ transform:rotate(5deg) scale(1.04); z-index:3; box-shadow:0 12px 26px rgba(0,0,0,.5); outline:3px solid #ff9ec7; outline-offset:-3px;}
  .swapIcon{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:52px; height:52px; border-radius:50%; background:#fff; z-index:5;
    display:flex; align-items:center; justify-content:center; font-size:26px; color:#4f46e5;
    box-shadow:0 8px 20px rgba(0,0,0,.4); font-weight:900;}
</style>
</head>
<body>
<div class="stage">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="dots"></div>

  <div class="left">
    <div class="badge"><b>🧩</b> Trò chơi giải đố</div>
    <h1>Picture<span>Puzzle</span></h1>
    <div class="tag">Hoán đổi các mảnh để khôi phục bức tranh gốc.</div>
    <div class="pills">
      <div class="pill">🖼️ Nhiều ảnh đẹp</div>
      <div class="pill">💡 Gợi ý</div>
      <div class="pill">🏆 Xếp hạng</div>
    </div>
  </div>

  <div class="right">
    <div class="frame"></div>
    <div class="puzzle" id="pz"></div>
    <div class="swapIcon">⇄</div>
  </div>
</div>

<script src="img.js"></script>
<script>
  document.documentElement.style.setProperty('--img', `url("${IMG}")`);
  // lưới đúng vị trí, nhưng hoán đổi ô (0,2) và (2,0) để minh hoạ "swap"
  const cls = [
    ['p00','p01','swapB p20'],
    ['p10','p11','p12'],
    ['swapA p02','p21','p22'],
  ];
  const pz = document.getElementById('pz');
  cls.flat().forEach(c => {
    const d = document.createElement('div');
    d.className = 'tile ' + c;
    pz.appendChild(d);
  });
</script>
</body>
</html>
